<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">CO5085 — Deep Learning and Its Applications in Computer Vision</title>
  <desc id="desc">Course banner showing Classifiers, Self-Attention, Recurrent Networks, and Vision Transformers.</desc>
  <rect width="1280" height="320" rx="18" fill="#173f4c"/>
  <rect x="0" y="0" width="12" height="320" fill="#d35b12"/>
  <circle cx="1240" cy="40" r="120" fill="#a9cfc1" opacity=".08"/>
  <circle cx="780" cy="280" r="140" fill="#efae00" opacity=".04"/>
  <text x="64" y="66" fill="#a9cfc1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="20" letter-spacing="3">HCMUT · CO5085</text>
  <text x="64" y="122" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="700" font-size="42">Deep Learning</text>
  <text x="64" y="174" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="700" font-size="42">and Applications in Computer Vision</text>
  <text x="65" y="222" fill="#d6e7e2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="22">Classifiers · Self-Attention · Recurrence · Transfer Learning</text>
  <rect x="65" y="254" width="48" height="6" rx="3" fill="#efae00"/>
  <rect x="121" y="254" width="70" height="6" rx="3" fill="#d35b12"/>
  <rect x="199" y="254" width="102" height="6" rx="3" fill="#a9cfc1"/>

  <!-- Card 1: E1 Classifiers (CNN) -->
  <g transform="translate(820 62)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif">
    <rect width="96" height="166" rx="12" fill="#f7f5ef"/>
    <rect x="14" y="16" width="68" height="14" rx="3" fill="#a9cfc1"/>
    <!-- Conv grid -->
    <rect x="18" y="44" width="60" height="60" rx="4" fill="none" stroke="#173f4c" stroke-width="2"/>
    <path d="M38 44v60M58 44v60M18 64h60M18 84h60" stroke="#b6c8c7" stroke-width="1.5"/>
    <rect x="38" y="64" width="20" height="20" fill="#d35b12" opacity=".8"/>
    <text x="48" y="132" text-anchor="middle" font-size="11" font-weight="700" fill="#173f4c">E1: CNN</text>
    <text x="48" y="148" text-anchor="middle" font-size="9" fill="#5c7a77">86.9% Acc</text>
  </g>

  <!-- Card 2: E2 Self-Attention -->
  <g transform="translate(930 62)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif">
    <rect width="96" height="166" rx="12" fill="#a9cfc1"/>
    <rect x="14" y="16" width="68" height="14" rx="3" fill="#173f4c" opacity=".85"/>
    <!-- Attention arcs / tokens -->
    <circle cx="28" cy="62" r="6" fill="#173f4c"/>
    <circle cx="68" cy="62" r="6" fill="#173f4c"/>
    <circle cx="28" cy="98" r="6" fill="#173f4c"/>
    <circle cx="68" cy="98" r="6" fill="#173f4c"/>
    <path d="M28 62 C 48 42, 48 42, 68 62" fill="none" stroke="#173f4c" stroke-width="2.5"/>
    <path d="M28 98 C 48 118, 48 118, 68 98" fill="none" stroke="#173f4c" stroke-width="2.5"/>
    <path d="M28 62 L 68 98" stroke="#d35b12" stroke-width="2"/>
    <path d="M28 98 L 68 62" stroke="#d35b12" stroke-width="2"/>
    <text x="48" y="132" text-anchor="middle" font-size="11" font-weight="700" fill="#173f4c">E2: MSA</text>
    <text x="48" y="148" text-anchor="middle" font-size="9" fill="#173f4c">Attention</text>
  </g>

  <!-- Card 3: E3 Recurrent (LSTM/GRU) -->
  <g transform="translate(1040 62)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif">
    <rect width="96" height="166" rx="12" fill="#efae00"/>
    <rect x="14" y="16" width="68" height="14" rx="3" fill="#173f4c" opacity=".85"/>
    <!-- Recurrent step icon -->
    <path d="M20 54 h56 M20 74 h56 M20 94 h56" stroke="#173f4c" stroke-width="2" stroke-linecap="round"/>
    <path d="M66 50 l8 4 -8 4 M66 70 l8 4 -8 4 M66 90 l8 4 -8 4" fill="none" stroke="#173f4c" stroke-width="2" stroke-linecap="round"/>
    <path d="M28 54 C 14 74, 14 74, 28 94" fill="none" stroke="#d35b12" stroke-width="3"/>
    <text x="48" y="132" text-anchor="middle" font-size="11" font-weight="700" fill="#173f4c">E3: RNN</text>
    <text x="48" y="148" text-anchor="middle" font-size="9" fill="#173f4c">LSTM / GRU</text>
  </g>

  <!-- Card 4: A1 Transfer Learning (Swin-T) -->
  <g transform="translate(1150 62)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif">
    <rect width="96" height="166" rx="12" fill="#d35b12"/>
    <rect x="14" y="16" width="68" height="14" rx="3" fill="#f7f5ef"/>
    <!-- Hierarchical window grid -->
    <rect x="22" y="48" width="24" height="24" rx="2" fill="#f7f5ef" opacity=".9"/>
    <rect x="50" y="48" width="24" height="24" rx="2" fill="#f7f5ef" opacity=".9"/>
    <rect x="22" y="76" width="24" height="24" rx="2" fill="#f7f5ef" opacity=".9"/>
    <rect x="50" y="76" width="24" height="24" rx="2" fill="#efae00"/>
    <text x="48" y="132" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">A1: SWIN-T</text>
    <text x="48" y="148" text-anchor="middle" font-size="9" fill="#f7f5ef">81.7% CIFAR</text>
  </g>

  <text x="64" y="295" fill="#a9cfc1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14">TRAILBLAZER · HK261 (2026–2027) · HCMUT</text>
</svg>
